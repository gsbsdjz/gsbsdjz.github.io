<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>元梦农场计算器</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        .container {
            max-width: 400px;
            margin: 0 auto;
        }

        label {
            display: block;
            margin-bottom: 10px;
        }

        .input-group {
            display: flex;
            margin-bottom: 15px;
        }

        input {
            flex: 1;
            padding: 0 10px;
            font-size: 16px;
            height: 40px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .input-group input {
            border-radius: 4px 0 0 4px; /* 左侧圆角 */
        }

        button {
            height: 40px;
            padding: 0 15px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: 1px solid #4CAF50;
            border-radius: 0 4px 4px 0; /* 右侧圆角 */
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        .result {
            margin-top: 20px;
            font-weight: bold;
        }

        .format-info {
            display: block;
            margin-top: 10px;
            font-size: 0.9em;
            background-color: #f9f9f9;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>植物最早成熟时间</h1>

    <label for="currentTime">当前时间(刚浇完水):</label>
    <div class="input-group">
        <input type="text" id="currentTime" placeholder="请输入">
        <button onclick="fillCurrentTime()">自动获取</button>
    </div>

    <label for="autoMatureTime">自动成熟时间:</label>
    <div class="input-group">
        <input type="text" id="autoMatureTime" placeholder="请输入">
    </div>

    <button onclick="calculateMaturity()"
            style="width: 100%; height: 40px; background-color: #4CAF50; color: white; border: none; border-radius: 4px; font-size: 16px;">
        计算
    </button>

    <div class="result" id="result"></div>

    <div class="format-info" id="formatInfo">
        <p>输入格式说明：</p>
        <ul>
            <li><strong>HH:mm</strong> - 不跨天的时间，例如 "10:30"。</li>
            <li><strong>D:HH:mm</strong> - 跨天的时间，其中 D 表示天数，例如 "1:15:30" 表示下一天15:30 。</li>
        </ul>
    </div>
</div>

<script>
    function fillCurrentTime() {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        document.getElementById('currentTime').value = `${hours}:${minutes}`;
    }

    function parseTime(inputStr) {
        const parts = inputStr.split(':');
        if (parts.length === 3) {
            const days = parseInt(parts[0], 10);
            const hours = parseInt(parts[1], 10);
            const minutes = parseInt(parts[2], 10);
            return {totalHours: days * 24 + hours, minutes: minutes};
        } else if (parts.length === 2) {
            const hours = parseInt(parts[0], 10);
            const minutes = parseInt(parts[1], 10);
            return {totalHours: hours, minutes: minutes};
        } else {
            throw new Error("输入格式不正确，需为 D:HH:mm 或 HH:mm");
        }
    }

    function calculateMatureTime(yHours, yMinutes, zHours, zMinutes) {
        const yTotalMinutes = yHours * 60 + yMinutes;
        const zTotalMinutes = zHours * 60 + zMinutes;

        const xTotalMinutes = Math.floor((4 * zTotalMinutes + yTotalMinutes) / 5);

        const xHours = Math.floor(xTotalMinutes / 60);
        const xMinutes = xTotalMinutes % 60;

        return {hours: xHours, minutes: xMinutes};
    }

    function calculateMaturity() {
        const currentTimeInput = document.getElementById('currentTime').value;
        const autoMatureTimeInput = document.getElementById('autoMatureTime').value;

        try {
            const currentTime = parseTime(currentTimeInput);
            const autoMatureTime = parseTime(autoMatureTimeInput);

            const matureTime = calculateMatureTime(currentTime.totalHours, currentTime.minutes, autoMatureTime.totalHours, autoMatureTime.minutes);
            let result;
            if (matureTime.hours >= 24) {
                const days = Math.floor(matureTime.hours / 24);
                const hours = matureTime.hours % 24;
                result = `${days}:${String(hours).padStart(2, '0')}:${String(matureTime.minutes).padStart(2, '0')}`;
            } else {
                result = `${String(matureTime.hours).padStart(2, '0')}:${String(matureTime.minutes).padStart(2, '0')}`;
            }
            document.getElementById('result').textContent = `最早成熟时间为: ${result}`;
        } catch (error) {
            document.getElementById('result').textContent = `错误: ${error.message}`;
        }
    }
</script>

</body>
</html>
